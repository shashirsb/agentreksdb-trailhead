# Gate 5 — Attested commit. Blocking. Proves "AI-only" instead of claiming it: every commit in the PR
# must be signed by gitsign with the Trailhead workflow identity (keyless Sigstore, logged in Rekor)
# and carry the Trailhead trailers. A commit typed by a human fails here.
#
# This gate only reads commit metadata and signatures — it never builds or runs PR code — so it does
# not wait on gate-diff-policy the way gate-tests and gate-perf do.
#
# PINNING: every `uses:` is a full 40-char commit SHA, and the gitsign release is pinned by
# version and sha256 rather than installed through a third-party action.
name: gate-attestation

on:
  pull_request:
  merge_group:

concurrency:
  group: gate-attestation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# No ambient permissions; the single job grants itself the minimum it needs.
permissions: {}

env:
  # The workflow in agentreksdb-trailhead that signs generated commits.
  TRAILHEAD_IDENTITY_REGEXP: ${{ vars.TRAILHEAD_IDENTITY_REGEXP || '^https://github\.com/shashirsb/agentreksdb-trailhead/\.github/workflows/commit\.yml@refs/heads/main$' }}
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  verify:
    name: gate-attestation / verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # `sigstore/gitsign-installer` does not exist. It was not merely unpinnable: the repository
      # 404s, so this step would have failed the first time a real signed commit reached the gate —
      # and because this check is required, that failure would have blocked every merge.
      #
      # This gate only needs `gitsign verify`, so it installs the upstream release directly rather
      # than through anybody's action. That is a smaller trust path than either available action:
      # the thing deciding whether a signature is valid is now the sigstore release itself, checked
      # against a sha256 pinned here, with no third party in between. It is the same pattern the
      # gitleaks tarball already uses in gate-diff-policy, for the same reason.
      #
      # commit.yml, which has to SIGN rather than verify, still uses chainguard-dev/actions
      # (pinned), because signing needs the full git integration that the action configures.
      #
      # Bump GITSIGN_VERSION and GITSIGN_SHA256 together, never one alone.
      - name: install gitsign (pinned release, checksum verified)
        env:
          GITSIGN_VERSION: 0.18.0
          GITSIGN_SHA256: 2bc625472a08fea3bb6a57982c7d8b4978d1032251d305ceef3bf2ded0ca4483
        run: |
          set -euo pipefail
          url="https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          curl -sSfL --retry 3 --max-time 300 -o gitsign "$url"
          echo "${GITSIGN_SHA256}  gitsign" > gitsign.sha256
          if ! sha256sum -c gitsign.sha256; then
            echo "::error::gitsign does not match the pinned sha256. Refusing to run it: this binary"
            echo "::error::decides whether a commit is signed by the pipeline, so a swapped one would"
            echo "::error::let anything through."
            exit 1
          fi
          chmod +x gitsign
          mkdir -p "$RUNNER_TEMP/bin" && mv gitsign "$RUNNER_TEMP/bin/gitsign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitsign" version
      - name: resolve range
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "range=${PR_BASE}..${PR_HEAD}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${MG_BASE}..${MG_HEAD}" >> "$GITHUB_OUTPUT"
          fi
      - name: every commit signed by the Trailhead pipeline, with trailers
        env:
          RANGE: ${{ steps.refs.outputs.range }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          fail=0
          if ! commits=$(git rev-list --no-merges "$RANGE"); then
            echo "::error::could not resolve the commit range"; exit 1
          fi
          if [ -z "$commits" ]; then echo "::error::no commits to verify; refusing an empty change"; exit 1; fi
          # Merge commits: none are allowed in a PR (Trailhead pushes a single linear commit). In the merge
          # queue, the only merge commits allowed are the ones GitHub itself creates, signed by its key.
          merges=$(git rev-list --merges "$RANGE")
          if [ -n "$merges" ]; then
            if [ "$EVENT" != "merge_group" ]; then
              echo "::error::merge commits are not allowed in Trailhead PRs: $merges"; exit 1
            fi
            curl -fsSL https://github.com/web-flow.gpg | gpg --batch --import 2>/dev/null
            for m in $merges; do
              committer=$(git log -1 --format='%ce' "$m")
              if [ "$committer" != "noreply@github.com" ] || ! git verify-commit "$m" 2>/dev/null; then
                echo "::error::merge commit $m was not created and signed by GitHub"; fail=1
              fi
            done
          fi
          for c in $commits; do
            echo "── $c"
            if ! gitsign verify \
                --certificate-identity-regexp "$TRAILHEAD_IDENTITY_REGEXP" \
                --certificate-oidc-issuer "$OIDC_ISSUER" "$c"; then
              echo "::error::$c is not signed by the Trailhead pipeline identity. Human-authored commits are not accepted: open an intent on Trailhead instead."
              fail=1
              continue
            fi
            trailers=$(git log -1 --format='%(trailers:only,unfold)' "$c")
            for t in Generated-By Spec-Hash Trailhead-Intent; do
              if ! printf '%s\n' "$trailers" | grep -q "^$t: ."; then
                echo "::error::$c is missing the '$t:' trailer."
                fail=1
              fi
            done
          done
          exit $fail
