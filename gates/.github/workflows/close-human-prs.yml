# AgentreksDB is written only by AI from public intent. Pull requests not opened by the Trailhead
# GitHub App are closed with a pointer to Trailhead — politely, and without judging the idea.
name: close-human-prs

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    name: close-human-prs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login != vars.TRAILHEAD_BOT_LOGIN
    steps:
      - name: comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TRAILHEAD_URL: ${{ vars.TRAILHEAD_URL || 'https://trailhead.agentreks.dev' }}
        run: |
          body=$(cat <<EOF
          Hi @${AUTHOR}, thank you for wanting to improve AgentreksDB.

          This project is built a little differently: no human writes code here. Every change is generated by one pinned model on the project's infrastructure, from an intent anyone can submit, and every prompt is public.

          To get this change in, please open it as an intent on Trailhead: ${TRAILHEAD_URL}
          Describe the behaviour you want and the test that would prove it; the pipeline writes the code and the governing body reviews it in the weekly train.

          Closing this pull request automatically. Your idea is welcome; only the route is different.
          EOF
          )
          gh pr comment "$PR" --repo "$REPO" --body "$body"
          gh pr close "$PR" --repo "$REPO"
