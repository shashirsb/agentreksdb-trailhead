# Trailhead diff-policy. Read by `trailhead policy check --manifest diff.json --policy gates/diff-policy.toml`.
#
# level = "block": hard stop — the change goes to a human governor and cannot merge on gates alone.
# level = "warn":  annotated on the PR; does not stop the merge.
# kind:
#   "path"       — `pattern` matches the file path
#   "added_line" — `pattern` matches each added line
#   "lockfile"   — `pattern` matches the path of a changed lockfile (any Cargo.lock delta)
#   "binary"     — triggers when the file is binary and `pattern` matches its path (".*" = any)
# exempt_paths — regexes; a file whose path matches any of them is skipped by that rule.
#
# This file is a protected path (CODEOWNERS): the generator cannot loosen its own policy.

# ── Supply chain ────────────────────────────────────────────────────────────────────────────────
[[rule]]
id = "lockfile-delta"
level = "block"
kind = "lockfile"
pattern = '(^|/)Cargo\.lock$'
exempt_paths = []
message = "Dependency graph changed (Cargo.lock). New or updated crates need cargo-vet audit and human review."

# Patterns use the Rust `regex` crate syntax (no look-around).
[[rule]]
id = "cargo-manifest"
level = "warn"
kind = "path"
pattern = '(^|/)Cargo\.toml$'
exempt_paths = []
message = "Cargo.toml changed; any real dependency change also moves Cargo.lock, which blocks."

[[rule]]
id = "git-or-path-source"
level = "block"
kind = "added_line"
pattern = '\b(git|path|registry)\s*=\s*"'
exempt_paths = []
message = "New git, path or alternate-registry source."

[[rule]]
id = "feature-net-ffi"
level = "block"
kind = "added_line"
pattern = '(?i)features\s*=\s*\[[^\]]*("(net|ffi|socket|http|tls|openssl|native-tls|curl)[^"]*")'
exempt_paths = []
message = "Feature flag enabling networking or FFI."

# ── Unsafe and native code ──────────────────────────────────────────────────────────────────────
[[rule]]
id = "unsafe-code"
level = "block"
kind = "added_line"
pattern = '\bunsafe\s*(\{|fn\b|impl\b|trait\b|extern\b)|allow\(\s*unsafe_code\s*\)'
exempt_paths = []
message = "New unsafe code. Needs the governor:unsafe tag and Miri on the touched crate."

[[rule]]
id = "ffi-asm"
level = "block"
kind = "added_line"
pattern = '\bextern\s+"C"|\basm!\s*\(|\bglobal_asm!'
exempt_paths = []
message = "FFI or inline assembly."

# ── Build, CI and release surface (where xz hid) ───────────────────────────────────────────────
[[rule]]
id = "build-script"
level = "block"
kind = "path"
pattern = '(^|/)build\.rs$'
exempt_paths = []
message = "Build scripts run arbitrary code at compile time."

[[rule]]
id = "build-config"
level = "block"
kind = "path"
pattern = '(^|/)(\.cargo/|rust-toolchain(\.toml)?$|Dockerfile[^/]*$|Makefile$|justfile$|\.github/|gates/|scripts/release)'
exempt_paths = []
message = "Build, CI, release or gate configuration changed."

[[rule]]
id = "proc-macro"
level = "block"
kind = "added_line"
pattern = '^\s*proc-macro\s*=\s*true|#\[proc_macro'
exempt_paths = []
message = "Procedural macros run at compile time."

# ── Sensitive paths ─────────────────────────────────────────────────────────────────────────────
[[rule]]
id = "sensitive-path"
level = "block"
kind = "path"
pattern = '(^|/)(crypto|auth|signing|tls|ledger|attest|keys?)(/|\.rs$|_)'
exempt_paths = []
message = "Touches crypto, auth, signing, TLS, ledger or key paths. Always human-reviewed."

# ── Egress, processes, secrets ──────────────────────────────────────────────────────────────────
[[rule]]
id = "network-egress"
level = "block"
kind = "added_line"
pattern = '\b(TcpStream|TcpListener|TcpSocket|UdpSocket|UnixStream|UnixListener|UnixDatagram|ToSocketAddrs|SocketAddr::|lookup_host|tokio::net|async_std::net|socket2|reqwest::|hyper::Client|ureq::|isahc::|surf::|curl::|Client::builder)'
exempt_paths = ['(^|/)net/']
message = "New network call outside the net/ module."

[[rule]]
id = "process-spawn"
level = "block"
kind = "added_line"
pattern = '\b(std::process::Command|process::Command|Command::new)\b'
exempt_paths = ['(^|/)(tests|benches|xtask)/']
message = "Spawns an external process."

[[rule]]
id = "secret-env-read"
level = "block"
kind = "added_line"
pattern = '(?i)env::var(_os)?\s*\(\s*"[^"]*(key|token|secret|pass(word)?|credential)[^"]*"'
exempt_paths = ['(^|/)config(/|\.rs$)']
message = "Reads a secret-looking environment variable outside the config module."

[[rule]]
id = "secret-file-read"
level = "block"
kind = "added_line"
pattern = '~/\.ssh|\.ssh/|/proc/|/etc/(passwd|shadow)|\.aws/credentials|\.netrc'
exempt_paths = []
message = "Reads SSH keys, /proc, system credential files."

[[rule]]
id = "embedded-blob"
level = "block"
kind = "added_line"
pattern = '[A-Za-z0-9+/]{256,}={0,2}|\b(0x)?[0-9a-fA-F]{256,}\b|include_bytes!\s*\('
exempt_paths = []
message = "Embedded base64/hex blob over 256 characters, or include_bytes! of a file."

[[rule]]
id = "binary-file"
level = "block"
kind = "binary"
pattern = '.*'
exempt_paths = []
message = "Binary file added or changed (fixtures, archives, blobs)."

[[rule]]
id = "compressed-fixture"
level = "block"
kind = "path"
pattern = '\.(xz|gz|bz2|zst|tar|zip|7z|lz4)$'
exempt_paths = []
message = "Compressed archive in the tree."

[[rule]]
id = "trojan-source"
level = "block"
kind = "added_line"
pattern = '[\x{202A}-\x{202E}\x{2066}-\x{2069}\x{200B}-\x{200F}\x{FEFF}]'
exempt_paths = []
message = "Bidirectional-control or invisible Unicode character (Trojan Source)."

[[rule]]
id = "environment-gated-cfg"
level = "block"
kind = "added_line"
pattern = '(?i)(gethostname|hostname::get|SystemTime::now\(\)\s*[><]|chrono::Utc::now\(\)\s*[><]|cfg\(\s*(target_os|target_env)\s*=\s*"[^"]*"\s*\)\s*\]\s*fn\s+\w*(auth|verify|check))'
exempt_paths = []
message = "Behaviour gated by hostname or wall-clock comparison (logic-bomb pattern)."

[[rule]]
id = "telemetry"
level = "block"
kind = "added_line"
pattern = '(?i)\b(phone[_-]?home|telemetry|analytics::|sentry::init|segment::)'
exempt_paths = []
message = "Telemetry or phone-home feature."

[[rule]]
id = "disabled-safety"
level = "block"
kind = "added_line"
pattern = '(?i)(skip|disable|bypass)_?(verify|verification|signature|auth|quorum|fsync|checksum)'
exempt_paths = []
message = "Disables verification, auth, quorum, fsync or checksum checks."

# ── Warnings ────────────────────────────────────────────────────────────────────────────────────
[[rule]]
id = "unwrap-in-server"
level = "warn"
kind = "added_line"
pattern = '\.unwrap\(\)|\.expect\('
exempt_paths = ['(^|/)(tests|benches|examples)/', '_test\.rs$']
message = "unwrap/expect in non-test code; prefer a typed error."

[[rule]]
id = "lint-allow"
level = "warn"
kind = "added_line"
pattern = '#!?\[allow\('
exempt_paths = []
message = "A lint was silenced."

[[rule]]
id = "ignored-test"
level = "warn"
kind = "added_line"
pattern = '#\[ignore\]'
exempt_paths = []
message = "A test was marked #[ignore]."

[[rule]]
id = "test-file-deleted"
level = "warn"
kind = "path"
pattern = '(^|/)(tests|fuzz|sim|benches)/'
exempt_paths = []
message = "Test, fuzz, benchmark or simulation files changed; check none were weakened or deleted. Benchmarks are included because lightening a benchmark hides a slowdown."

# ---------------------------------------------------------------------------
# Sabotage by deletion. Everything above reads added lines, so a diff that only
# REMOVES a safety check raised nothing at all. These rules read removed lines.
#
# `dropped_guard` fires only when the pattern disappears from a file without any
# surviving added line matching it, so moving, renaming or reformatting a guard is
# quiet while deleting one is loud.
# ---------------------------------------------------------------------------

[[rule]]
id = "dropped-durability"
level = "block"
kind = "dropped_guard"
pattern = '\b(sync_all|sync_data|fsync|fdatasync|flush_and_sync|durable_commit)\b'
exempt_paths = []
message = "A durability barrier (fsync/sync_all) was deleted. Removing a sync is how a change silently loses committed data; a human must confirm this is intended."

[[rule]]
id = "dropped-authorization"
level = "block"
kind = "dropped_guard"
pattern = '\b(authorize|authorise|check_auth|require_auth|ensure_permission|verify_token|is_authorized|assert_permission)\b'
exempt_paths = []
message = "An authorization check was deleted. This is the most common shape of a deliberate auth bypass."

[[rule]]
id = "dropped-verification"
level = "block"
kind = "dropped_guard"
pattern = '\b(verify_signature|verify_checksum|verify_hash|validate_|check_integrity|constant_time_eq|ct_eq)\b'
exempt_paths = []
message = "A signature, checksum or integrity verification was deleted."

[[rule]]
id = "dropped-quorum"
level = "block"
kind = "dropped_guard"
pattern = '\b(quorum|majority|commit_index|match_index|has_quorum)\b'
exempt_paths = []
message = "A quorum or replication safety check was deleted. Weakening quorum silently breaks consistency guarantees."

[[rule]]
id = "dropped-bounds-check"
level = "block"
kind = "dropped_guard"
pattern = '\b(MAX_[A-Z_]+|max_depth|max_len|max_size|size_limit|checked_add|checked_mul|checked_sub|saturating_)\b'
exempt_paths = []
message = "A bounds, limit or overflow check was deleted. Removing a cap turns a parser into a denial-of-service vector."

[[rule]]
id = "removed-unsafe-denial"
level = "block"
kind = "removed_line"
pattern = 'forbid\(unsafe_code\)|deny\(unsafe_code\)'
exempt_paths = []
message = "A crate-level ban on `unsafe` was removed."

[[rule]]
id = "removed-test-assertion"
level = "warn"
kind = "removed_line"
pattern = '\b(assert|assert_eq|assert_ne|proptest!|#\[test\])\b'
exempt_paths = []
message = "Test assertions were removed. Confirm the behaviour they pinned is still covered, and that the change did not delete the test that would have failed."

[[rule]]
id = "removed-rate-limit"
level = "block"
kind = "dropped_guard"
pattern = '\b(rate_limit|ratelimit|throttle|backoff|timeout|deadline)\b'
exempt_paths = []
message = "A rate limit, timeout or backoff was deleted. Removing a timeout is a denial-of-service enabler."

[[rule]]
id = "sql-string-built"
level = "block"
kind = "added_line"
pattern = '(format!|concat!|push_str)[^;]{0,80}\\b(SELECT|INSERT|UPDATE|DELETE|WHERE|UNION|DROP TABLE)\\b'
exempt_paths = ['(^|/)(tests|migrations)/']
message = "A query looks assembled from a format string rather than bound parameters. Use parameter binding."

[[rule]]
id = "discarded-guard-result"
level = "block"
kind = "added_line"
pattern = 'let _ *= *[a-z_:]*(authorize|authorise|require_auth|check_auth|verify_|validate_|ensure_)'
exempt_paths = []
message = "The result of a security check is discarded with `let _ =`. The call is still present, so a presence check passes, but its verdict is thrown away, which is the same as deleting it."

[[rule]]
id = "source-file-deleted"
level = "block"
kind = "deleted_file"
pattern = '\.(rs|toml|sql|ya?ml)$'
exempt_paths = []
message = "A whole file was deleted. A deleted file carries no removed lines, so the deletion rules above cannot see inside it: a human must confirm nothing load-bearing went with it."

[[rule]]
id = "guard-behind-flag"
level = "block"
kind = "added_line"
pattern = '\bif +[a-z_.()]{0,40}(enable|enabled|allow|strict|safe_mode|paranoid|check)[a-z_]* *[{&|]'
exempt_paths = ['(^|/)(tests|benches)/']
message = "A conditional was added around behaviour gated on a feature flag. If a durability, authorization or verification step now sits behind a flag that defaults to off, the step is gone for every default deployment. Confirm the default and that no safety barrier moved inside this branch."
