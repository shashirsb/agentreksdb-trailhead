# The ONLY path by which code reaches a target repo: the worker publishes a generated patch (a
# "bundle") whose SHA-256 is already in the public ledger; this workflow fetches it, checks that hash
# against the ledger, applies it to the recorded base, signs the commit with gitsign (keyless; the
# certificate names THIS workflow file), pushes `trailhead/<id>` as the Trailhead GitHub App and opens
# the PR. No person and no long-lived key can produce a commit that passes gate-attestation.
#
# PINNING: every `uses:` is a full 40-char commit SHA with the version in a trailing comment. This
# is the workflow whose OIDC identity gate-attestation trusts, and it holds the App private key: a
# mutable tag here is a direct path to signing arbitrary code as the Trailhead pipeline. Never
# reintroduce a tag or a branch ref.
name: commit
on:
  workflow_dispatch:
    inputs:
      intent_id:
        description: Trailhead intent id
        required: true
concurrency:
  group: commit-${{ inputs.intent_id }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write   # gitsign keyless signing via GitHub OIDC
jobs:
  sign-and-open:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRAILHEAD_URL: ${{ vars.TRAILHEAD_URL }}
      TARGET_REPO: ${{ vars.TRAILHEAD_TARGET_REPO }}
      INTENT: ${{ inputs.intent_id }}
    steps:
      - name: Validate input
        run: |
          [[ "$INTENT" =~ ^[0-9]+$ ]] || { echo "intent_id must be numeric"; exit 1; }
          [ -n "$TRAILHEAD_URL" ] && [ -n "$TARGET_REPO" ] || { echo "set vars TRAILHEAD_URL and TRAILHEAD_TARGET_REPO"; exit 1; }

      - name: Fetch bundle
        run: |
          set -euo pipefail
          curl -fsS "$TRAILHEAD_URL/api/bundles/$INTENT" -o bundle.json
          jq -e '.ready_to_sign == true' bundle.json >/dev/null || { echo "::error::intent $INTENT is not waiting for a commit (status $(jq -r .status bundle.json))"; exit 1; }
          jq -r .patch_b64 bundle.json | base64 -d > patch.diff
          got=$(sha256sum patch.diff | cut -d' ' -f1)
          [ "$got" = "$(jq -r .patch_sha256 bundle.json)" ] || { echo "::error::bundle hash mismatch"; exit 1; }
          base=$(jq -r .base bundle.json); seq=$(jq -r .ledger_seq bundle.json)
          # Validate before anything reaches $GITHUB_ENV (a newline there would inject variables).
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base is not a commit sha"; exit 1; }
          [[ "$seq" =~ ^[0-9]+$ ]] || { echo "::error::bad ledger seq"; exit 1; }
          echo "PATCH_SHA=$got" >> "$GITHUB_ENV"
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "SEQ=$seq" >> "$GITHUB_ENV"
          jq -r .message bundle.json > message.txt

      # The verifier container is what independently re-checks the ledger before anything is signed,
      # so its bytes have to be fixed: TRAILHEAD_VERIFIER_IMAGE must be digest-pinned, exactly as
      # gate-diff-policy requires of the same variable. There is deliberately no `:main` fallback —
      # defaulting to a mutable tag let whoever could push that tag choose the code that decides
      # whether a patch is legitimate, and an unset variable then looked like a working setup.
      # Resolve a digest with:
      #   docker buildx imagetools inspect <image>:<tag> --format '{{.Manifest.Digest}}'
      - name: Verify the ledger independently (pinned key, full chain, bound event)
        env:
          VERIFIER: ${{ vars.TRAILHEAD_VERIFIER_IMAGE }}
          PUBKEY: ${{ vars.TRAILHEAD_LEDGER_PUBKEY }}
        run: |
          set -euo pipefail
          [ -n "$PUBKEY" ] || { echo "::error::set repo variable TRAILHEAD_LEDGER_PUBKEY"; exit 1; }
          if [[ ! "$VERIFIER" =~ ^[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::vars.TRAILHEAD_VERIFIER_IMAGE must be digest-pinned"
            echo "::error::(ghcr.io/<owner>/agentreksdb-trailhead@sha256:<64 hex>). A mutable tag is"
            echo "::error::not accepted: this container decides whether the patch about to be signed"
            echo "::error::matches the public ledger. Current value: ${VERIFIER:-<unset>}"
            exit 1
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base is not a commit sha"; exit 1; }
          docker run --rm "$VERIFIER" trailhead ledger verify-remote \
            --api "$TRAILHEAD_URL" --pubkey "$PUBKEY" \
            --seq "$SEQ" --intent "$INTENT" --patch-sha256 "$PATCH_SHA" --base "$BASE"

      - name: App token for the target repo
        id: app
        # Pinned to the newest v1. A v3 of this action exists; moving to it changes how the App
        # private key is exchanged for a token in the one workflow that can sign, so a major bump
        # is a governance decision and not part of pinning.
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.TRAILHEAD_APP_ID }}
          private-key: ${{ secrets.TRAILHEAD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.TRAILHEAD_TARGET_REPO_NAME }}

      # This action installs the binary that produces every Trailhead signature, so it is pinned by
      # SHA like everything else. `sigstore/gitsign-installer` does not resolve (see
      # gates/.github/workflows/gate-attestation.yml); the Chainguard action is the resolvable
      # installer and is what this repo already uses on the signing side.
      - name: Install gitsign
        uses: chainguard-dev/actions/setup-gitsign@8f31e9482b447ff2c69eca944a09b4b31a4a85d0 # v1.7.2

      - name: Apply, sign, push, open PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ vars.TRAILHEAD_BOT_LOGIN }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" target
          cd target
          git fetch --quiet origin main
          # The base must already be on main: no unreviewed history can ride along with the patch.
          git merge-base --is-ancestor "$BASE" origin/main || { echo "::error::base $BASE is not on main"; exit 1; }
          git checkout --quiet "$BASE"
          git checkout --quiet -b "trailhead/$INTENT"
          git apply --index --whitespace=nowarn ../patch.diff
          git -c user.name="$BOT" -c user.email="${BOT}@users.noreply.github.com" \
              -c gpg.format=x509 -c gpg.x509.program=gitsign -c commit.gpgsign=true \
              commit --quiet -F ../message.txt
          git verify-commit HEAD
          git push --quiet --force-with-lease origin "trailhead/$INTENT"
          title=$(head -1 ../message.txt)
          {
            echo "Generated by the pinned model from a public Trailhead intent. Humans gate; they do not write code."
            echo
            echo "Trailhead-Intent: $INTENT"
            echo "Prompt-Log: $TRAILHEAD_URL/api/intents/$INTENT"
            echo "Bundle: $TRAILHEAD_URL/api/bundles/$INTENT"
            echo
            echo '```'
            sed -n '/^Generated-By:/,$p' ../message.txt
            echo '```'
          } > ../body.md
          existing=$(gh pr list --repo "$TARGET_REPO" --head "trailhead/$INTENT" --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --repo "$TARGET_REPO" --head "trailhead/$INTENT" --base main --title "$title" --body-file ../body.md
          else
            gh pr edit "$existing" --repo "$TARGET_REPO" --body-file ../body.md
          fi
