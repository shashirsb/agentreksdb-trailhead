name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailhead
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trailhead
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Seed the test app the fake model edits
        run: git clone --depth 1 https://github.com/shashirsb/agentreksdb-trailhead-helloworld.git /tmp/helloworld
      - name: End-to-end pipeline
        run: FAKE_MODEL_REPO=/tmp/helloworld scripts/e2e.sh
      - name: Gate assurance — do the gates still catch planted sabotage?
        # The corpus is the only thing that proves the gates work. It must never silently
        # regress: a case that was caught yesterday and is missed today fails the build.
        # Known gaps are recorded in each case.toml and reported, not hidden.
        run: python3 gates/assurance/run.py
      - name: Publish the gate scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-scorecard
          path: gates/assurance/scorecard.json
          if-no-files-found: warn
