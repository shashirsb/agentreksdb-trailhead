# Trailhead's own CI. It runs in THIS repository, not in a target repo.
#
# PINNING: every `uses:` is a full 40-char commit SHA with the version in a trailing comment. This
# repo signs the commits that reach the target, so whoever can move a tag that runs here can reach
# the signing pipeline. The same rule the gates impose on agentreksdb applies to Trailhead itself.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailhead
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trailhead
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # `@stable` used to name the toolchain through the action's ref. Pinned by SHA the ref carries
      # no such meaning, so the toolchain is stated explicitly rather than resting on an input
      # default that a future pin bump could change.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, resolved 2026-10-27
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Seed the test app the fake model edits
        run: git clone --depth 1 https://github.com/shashirsb/agentreksdb-trailhead-helloworld.git /tmp/helloworld
      - name: End-to-end pipeline
        run: FAKE_MODEL_REPO=/tmp/helloworld scripts/e2e.sh
      - name: Sabotage checks — do the checks themselves still work?
        # The nine checks in gates/checks/ are the layer aimed at a bug someone planted on
        # purpose. They are plain Python with no coverage from `cargo test`, so without this
        # step they could break and nothing would say so until a real attack walked past them.
        run: python3 gates/checks/test_new_checks.py
      - name: Sabotage checks — run them over this very diff
        # Dogfooding: Trailhead is written by a model too, so the checks that guard the database
        # run over Trailhead's own changes. Advisory here (this repo is still human-edited and
        # full of prose), blocking in the target repo via gate-sabotage.yml.
        run: |
          git fetch -q origin "${GITHUB_BASE_REF:-main}" 2>/dev/null || true
          base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}" 2>/dev/null || git rev-parse HEAD~1)
          git diff "$base...HEAD" > /tmp/self.diff
          python3 gates/checks/obfuscation.py --diff /tmp/self.diff \
            --path-regex '\.(rs|toml|lock)$' --fail-on high || echo "::warning::obfuscation flagged this diff"
          python3 gates/checks/comment_consistency.py --diff /tmp/self.diff | tail -1
          python3 gates/checks/invariants.py --rules gates/invariants.toml --root crates | tail -1
      - name: Gate assurance — do the gates still catch planted sabotage?
        # The corpus is the only thing that proves the gates work. It must never silently
        # regress: a case that was caught yesterday and is missed today fails the build.
        # Known gaps are recorded in each case.toml and reported, not hidden.
        run: python3 gates/assurance/run.py
      - name: Publish the gate scorecard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-scorecard
          path: gates/assurance/scorecard.json
          if-no-files-found: warn
